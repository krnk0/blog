name: Deploy Next.js Blog

on:
  push:
    branches:
      - next-rewrite       # next-rewrite ブランチに push されたら実行

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: next-rewrite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './blog-next/package-lock.json'

      - name: Install dependencies
        run: |
          cd blog-next
          npm ci

      - name: Build Next.js
        run: |
          cd blog-next
          npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./blog-next/blog
